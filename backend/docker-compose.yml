version: '3.8'

services:
  pg:
    image: postgres:13
    container_name: pg-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: backend-pref
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-pref
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: 'postgresql://admin:admin@pg:5432/backend-pref'
      URL_REDIS: 'redis://redis:6379'
    depends_on:
      - pg
      - redis
    volumes:
      - .:/app
    command: sh ./start.sh

volumes:
  pg-data:
  redis-data:
